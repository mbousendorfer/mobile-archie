<!doctype html>
<!-- Desktop preview of the mobile-only fork: the app in a 390×844 iframe, a real
     phone viewport (dvh, media queries, position: fixed all resolve inside it).
     index.html sends any top-level window ≥ 768px here; the hash is carried both ways. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Archie — mobile</title>
    <link rel="icon" href="./assets/logos/archie-icon.svg" type="image/svg+xml" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
      }
      body {
        display: grid;
        place-items: center;
        overflow: auto;
      }
      iframe {
        width: 390px;
        height: min(844px, calc(100dvh - 48px));
        border: 0;
        border-radius: 48px;
        background: #fff;
        box-shadow:
          0 0 0 12px #000,
          0 24px 64px rgba(0, 0, 0, 0.5);
      }
    </style>
  </head>
  <body>
    <iframe id="phone" title="Archie" src="index.html"></iframe>
    <script>
      const phone = document.getElementById("phone");
      phone.src = "index.html" + location.hash;
      // Keep the frame's hash in step with the app's, so a reload lands on the same screen.
      phone.addEventListener("load", () => {
        phone.contentWindow.addEventListener("hashchange", () => {
          history.replaceState(null, "", phone.contentWindow.location.hash || "#");
        });
      });
    </script>
  </body>
</html>
